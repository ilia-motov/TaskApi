name: taskapi-mvp
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - tasks-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: taskapi
      RABBITMQ_DEFAULT_PASS: taskapi
    ports:
      - "127.0.0.1:56729:5672"
      - "127.0.0.1:15679:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  tasks-data:
